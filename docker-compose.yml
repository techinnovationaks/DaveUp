services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: daveup_owner
      POSTGRES_PASSWORD: daveup_owner_dev
      POSTGRES_DB: daveup
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daveup_owner -d daveup"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
